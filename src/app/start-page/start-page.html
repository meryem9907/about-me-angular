<h1 class="name">Meryem Ünüvar</h1>
<h2 class="welcome">{{ 'welcome' | translate }}</h2>

<div class="bubble-figure-container">
  <div class="bubble-container">
    <div class="bubble shadow bottom" [class.wiggle]="wiggle()" (click)="speak()">
      <span class="text-container"
        ><span class="text" [style.--chars]="typerService.messages().length">
          {{ typerService.visibleMsg() }}</span
        ></span
      >
    </div>
    @if (showRestart()) {
<div class="restart-container">
      <button class="restart-btn" (click)="onRestart()">
        {{ 'restart' | translate }}
      </button>
    </div>    }
  </div>
  <img
    class="figure"
    src="me_pixel.png
    "
    alt="Pixel art representation"
    width="1024"
    height="1536"
    priority
  />
</div>
